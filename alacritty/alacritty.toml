[general]
import = [
    "~/.config/alacritty/catppuccin-mocha.toml"
]


[font]
normal = {
    family = "JetBrainsMono NFM",
    style = "Regular"
}

bold = {
    family = "JetBrainsMono NFM",
    style = "Bold"
}

italic = {
    family = "JetBrainsMono NFM",
    style = "Italic"
}

size = 11


[window]
opacity = 0.8

padding = { x = 4, y = 4 }


[debug]
renderer = "gles2pure"
